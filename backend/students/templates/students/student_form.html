<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Student Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: linear-gradient(-45deg, #0f172a, #312e81, #164e63, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.25;
            animation: float 9s ease-in-out infinite;
            pointer-events: none;
        }

        .orb.one {
            width: 220px;
            height: 220px;
            background: #818cf8;
            top: 8%;
            left: 8%;
        }

        .orb.two {
            width: 280px;
            height: 280px;
            background: #22d3ee;
            bottom: 5%;
            right: 5%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        .form-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.3);
            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            font-size: 30px;
            box-shadow: 0 10px 30px rgba(34,211,238,0.2);
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        form p {
            margin-bottom: 19px;
        }

        form label {
            display: block;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 11px;
            outline: none;
            color: white;
            background: rgba(15,23,42,0.35);
            font-size: 14px;
            transition: 0.3s ease;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #67e8f9;
            box-shadow: 0 0 0 3px rgba(34,211,238,0.15);
            background: rgba(15,23,42,0.55);
        }

        form select option {
            background: #1e293b;
            color: white;
        }

        form textarea {
            min-height: 100px;
            resize: vertical;
        }

        form input::placeholder,
        form textarea::placeholder {
            color: #94a3b8;
        }

        form .helptext {
            display: block;
            color: #cbd5e1;
            font-size: 11px;
            margin-top: 6px;
        }

        form ul.errorlist {
            color: #fecaca;
            font-size: 12px;
            margin: 5px 0 8px 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 8px 25px rgba(99,102,241,0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 13px 30px rgba(34,211,238,0.3);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            text-align: center;
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="form-container">

        <div class="icon">🎓</div>

        <h1>Student Registration</h1>

        <p class="subtitle">
            Join our Student Portal by completing your registration details.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">
                Register Student →
            </button>
        </form>

        <p class="footer-text">
            Student Portal · Registration System
        </p>

    </div>

</body>
</html>
